[build]
target = "x86_64-unknown-none"

# Static relocation model: prevents the compiler from emitting
# GOTPCREL relocations (GOT-relative addressing). Without this flag,
# the linker produces hundreds of GOT entries for alloc/String/Vec
# call sites, only the first ~40 of which are populated in a static
# binary. Any call through the unpopulated entries jumps to 0x0.
# -no-pie ensures ET_EXEC output; relocation-model=static ensures
# the *compiler* does not generate GOT-relative code.
[target.x86_64-unknown-none]
rustflags = ["-C", "relocation-model=static", "-C", "link-arg=-no-pie"]

[unstable]
build-std = ["core", "compiler_builtins", "alloc"]
build-std-features = ["compiler-builtins-mem"]
